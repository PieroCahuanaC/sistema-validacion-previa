# Integración continua: análisis estático y pruebas en cada push y en cada pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [calidad, main]

permissions:
  contents: read

jobs:
  analisis-estatico:
    name: Análisis estático (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (PEP 8, complejidad, seguridad)
        run: ruff check . --output-format github

  pruebas:
    name: Pruebas unitarias y de integración (PyTest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: svp
          POSTGRES_PASSWORD: svp_ci
          POSTGRES_DB: svp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U svp" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://svp:svp_ci@localhost:5432/svp_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: PyTest con cobertura
        run: pytest --cov --cov-report=xml --cov-report=term --junitxml=reporte-pruebas.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reportes-pruebas
          path: |
            backend/coverage.xml
            backend/reporte-pruebas.xml
          retention-days: 30

  sonarqube:
    name: Análisis estático (SonarQube Cloud)
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        if: env.SONAR_TOKEN != ''
        with:
          name: reportes-pruebas
          path: backend
      - uses: SonarSource/sonarqube-scan-action@v7
        if: env.SONAR_TOKEN != ''

  frontend:
    name: Compilación del frontend (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
