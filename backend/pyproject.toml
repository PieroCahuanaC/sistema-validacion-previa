[project]
name = "svp-backend"
version = "0.1.0"
description = "Sistema presupuestal de validación previa — backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migraciones/versions"]

[tool.ruff.lint]
# E/F: errores y pyflakes; I: orden de imports; N: nomenclatura PEP 8; B: errores probables;
# C90: complejidad ciclomática; UP: sintaxis moderna; S: seguridad (bandit)
select = ["E", "F", "I", "N", "B", "C90", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integracion: pruebas que requieren PostgreSQL"]

[tool.coverage.run]
source = ["app"]
